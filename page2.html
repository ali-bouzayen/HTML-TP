<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f1f5f9; color: #1e293b; line-height: 1.6; }
header { background: #1e3a8a; color: white; text-align: center; padding: 25px 10px 0; }
header h1 { margin: 0 0 15px; }
nav a { display: inline-block; color: white; text-decoration: none; padding: 10px 22px; }
nav a:hover { background: #2563eb; }
main { max-width: 850px; margin: 25px auto; padding: 0 15px; }
section { background: white; padding: 22px; margin-bottom: 22px; border-radius: 10px; border-top: 4px solid #2563eb; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
h2 { color: #1e3a8a; margin-top: 0; }
h3 { color: #2563eb; }
img { max-width: 100%; height: auto; border-radius: 8px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: center; }
th { background: #1e3a8a; color: white; }
tr:nth-child(even) td { background: #eff6ff; }
label { font-weight: bold; }
input[type=text], input[type=email], input[type=password], select, textarea { width: 100%; max-width: 380px; padding: 8px; margin: 4px 0 12px; border: 1px solid #94a3b8; border-radius: 5px; font-size: 1rem; }
input[type=radio], input[type=checkbox] { margin-left: 10px; }
input[type=submit], input[type=reset] { padding: 10px 22px; border: none; border-radius: 5px; color: white; font-size: 1rem; cursor: pointer; margin-top: 8px; }
input[type=submit] { background: #2563eb; }
input[type=reset] { background: #64748b; }
a { color: #2563eb; }
footer { background: #1e3a8a; color: white; text-align: center; padding: 15px; }
@media (max-width: 600px) { nav a { padding: 8px 12px; } }
</style>
</head>
